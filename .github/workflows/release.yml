# =============================================================================
# Release Pipeline — Tag-Triggered Docker Image Publishing
# =============================================================================
# When a semantic-version tag (v*.*.*) is pushed, this workflow builds all
# Docker images, tags them with the semantic version and `latest`, runs a
# Trivy security scan, and pushes them to the GitHub Container Registry
# (GHCR).  It reuses the same BuildKit cache strategy as the Docker workflow.
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*.*.*"

  # Allow manual triggering from the Actions tab.
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g. v1.0.0) — leave empty to use the tag"
        required: false
        type: string

# Only one release run per tag at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  COMPOSE_PROJECT_NAME: tutor-marketplace
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/tutor-marketplace

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # release — build, tag, scan, push all service images
  # ---------------------------------------------------------------------------
  release:
    name: Build · Tag · Scan · Push
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ----------------------------------------------------------------- Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------- Determine the release version
      - name: Determine release version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip a leading "v" if present (e.g. v1.0.0 -> 1.0.0)
          NUMERIC="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "numeric=${NUMERIC}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (numeric: ${NUMERIC})"

      # ------------------------------------------------------- Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------- Cache Docker BuildKit layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-release-
            ${{ runner.os }}-buildx-

      # ------------------------------------------- Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------- Build all images
      # We build with docker compose (which uses the per-service Dockerfiles)
      # and then retag the resulting images for the registry.
      - name: Build Docker images
        run: docker compose build --progress=plain
        env:
          BUILDKIT_PROGRESS: plain
          BUILDKIT_INLINE_CACHE: "1"
          JWT_SECRET: release-build-secret-key-min-16
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3001

      # ----------------------------------- Tag images for GHCR (version + latest)
      - name: Tag images for GHCR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NUMERIC="${{ steps.version.outputs.numeric }}"

          for svc in api worker web admin; do
            LOCAL="tutor-marketplace-${svc}"
            REMOTE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${svc}"

            # Tag with full version (e.g. v1.0.0)
            docker tag "$LOCAL" "${REMOTE}:${VERSION}"
            # Tag with numeric version (e.g. 1.0.0)
            docker tag "$LOCAL" "${REMOTE}:${NUMERIC}"
            # Tag with latest
            docker tag "$LOCAL" "${REMOTE}:latest"

            echo "Tagged ${REMOTE}:${VERSION}, ${REMOTE}:${NUMERIC}, ${REMOTE}:latest"
          done

      # ------------------------------------------- Trivy scan before pushing
      - name: Run Trivy vulnerability scanner (API)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: tutor-marketplace-api
          format: sarif
          output: trivy-api-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (Worker)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: tutor-marketplace-worker
          format: sarif
          output: trivy-worker-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (Web)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: tutor-marketplace-web
          format: sarif
          output: trivy-web-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (Admin)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: tutor-marketplace-admin
          format: sarif
          output: trivy-admin-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # ------------------------------------------------------- Push images to GHCR
      - name: Push images to GHCR
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NUMERIC="${{ steps.version.outputs.numeric }}"

          for svc in api worker web admin; do
            REMOTE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${svc}"

            docker push "${REMOTE}:${VERSION}"
            docker push "${REMOTE}:${NUMERIC}"
            docker push "${REMOTE}:latest"

            echo "Pushed ${REMOTE}:${VERSION}, ${REMOTE}:${NUMERIC}, ${REMOTE}:latest"
          done

      # ------------------------------------------- Upload Trivy SARIF artifacts
      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-trivy-sarif
          path: trivy-*.sarif
          retention-days: 30

      # --------------------------------------------------- Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}