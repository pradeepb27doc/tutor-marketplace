# =============================================================================
# CI Pipeline — Tutor Marketplace Monorepo
# =============================================================================
# Runs on every push and pull request.  Performs code-quality checks
# (lint, typecheck, unit tests with coverage) and builds all workspace
# packages to catch compile-time regressions early.
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancel in-flight runs for the same ref when new commits arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.7.0"

jobs:
  # ---------------------------------------------------------------------------
  # verify — lint, typecheck, unit tests (coverage + junit), build
  # ---------------------------------------------------------------------------
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tutor_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ----------------------------------------------------------------- Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------- Setup Node 22
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --------------------------------------------------------- Enable Corepack
      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      # ------------------------------------------------- Cache pnpm store
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-

      # --------------------------------------------------- Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------- Generate Prisma Client
      - name: Generate Prisma Client
        run: pnpm --filter @tutor-marketplace/database prisma generate

      # --------------------------------------------------------------- Lint
      - name: Lint
        run: pnpm lint

      # --------------------------------------------------------- Typecheck
      - name: Typecheck
        run: pnpm typecheck

      # ------------------------------------ Run unit tests (coverage + junit)
      - name: Run unit tests
        run: |
          pnpm test:coverage \
            --reporter=verbose \
            --reporter=junit \
            --outputFile=test-results/junit.xml \
            --coverage.reporter=text \
            --coverage.reporter=lcov \
            --coverage.reporter=html
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tutor_marketplace?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-minimum-16-chars
          JWT_ACCESS_TOKEN_EXPIRY_SECONDS: 900
          JWT_REFRESH_TOKEN_EXPIRY_DAYS: 30
          RAZORPAY_KEY_ID: rzp_test_ci_placeholder
          RAZORPAY_KEY_SECRET: ci-placeholder-secret
          RAZORPAY_WEBHOOK_SECRET: ci-placeholder-webhook
          NODE_ENV: development
          LOG_LEVEL: warn

      # ----------------------------------------------- Build all packages
      - name: Build all workspace packages
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3001

      # ------------------------------------------------- Upload coverage artifact
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # ----------------------------------------------------- Upload junit artifact
      - name: Upload junit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: test-results/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # workspace-verify — structural / schema / API-spec sanity checks
  # ---------------------------------------------------------------------------
  workspace-verify:
    name: Workspace Verification
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ env.PNPM_VERSION }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @tutor-marketplace/database prisma generate

      - name: Run workspace verification
        run: pnpm verify